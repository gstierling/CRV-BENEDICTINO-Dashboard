<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENEDICTINO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;
    --panel:#ffffff;
    --panel-2:#f2efe6;
    --teal:#145c4e;
    --teal-dark:#0d4238;
    --red:#c0392b;
    --red-dark:#9e2f22;
    --gold:#a9781f;
    --limon:#c9a30a;
    --amarillo-fondo:#f2c230;
    --text:#1c2b28;
    --text-dim:#6b7b76;
    --border:#e3ded2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    display:flex;
    justify-content:center;
    padding:16px 14px 36px;
  }
  .app-container{
    width:100%;
    max-width:640px;
  }
  .title{
    text-align:center;
    font-size:2.6rem;
    font-weight:900;
    letter-spacing:2px;
    margin:0;
    color:var(--teal);
  }
  .subtitulo-app{
    text-align:center;
    margin:0;
    font-size:1.5rem;
    font-weight:700;
    color:var(--text-dim);
  }

  /* ===== Selector de fecha ===== */
  .selector-fecha-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    margin:6px 0 14px;
  }
  .selector-fecha-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    padding:9px 16px;
    border-radius:12px;
    cursor:pointer;
    text-transform:capitalize;
    transition:border-color 0.15s ease;
    box-shadow:0 1px 3px rgba(20,92,78,0.08);
  }
  .selector-fecha-btn:hover{border-color:var(--teal);}
  .selector-fecha-btn .flecha{
    width:16px;height:16px;color:var(--red);
    transition:transform 0.15s ease;
  }
  .selector-fecha-wrap.abierto .flecha{transform:rotate(180deg);}
  .selector-fecha-lista{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    min-width:230px;
    max-height:260px;
    overflow-y:auto;
    z-index:40;
    box-shadow:0 12px 28px rgba(20,92,78,0.18);
  }
  .selector-fecha-wrap.abierto .selector-fecha-lista{display:block;}
  .opcion-fecha{
    padding:11px 16px;
    font-weight:600;
    font-size:0.98rem;
    color:var(--text);
    cursor:pointer;
    text-transform:capitalize;
    border-bottom:1px solid var(--border);
  }
  .opcion-fecha:last-child{border-bottom:none;}
  .opcion-fecha:hover{background:var(--panel-2);}
  .opcion-fecha.activa{color:var(--teal); font-weight:800;}

  /* ===== Botellas entregadas ===== */
  .suma-total{
    text-align:center;
    margin:4px 0 14px;
    font-size:2.025rem;
    color:var(--text-dim);
    font-weight:800;
  }
  .hasta-ahora{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    color:var(--text-dim);
    margin-top:2px;
  }
  .suma-total span#suma-total{
    display:block;
    font-size:5.2rem;
    font-weight:900;
    color:var(--teal-dark);
    margin-top:0;
    line-height:1;
  }

  /* ===== Joystick ===== */
  .seccion-joystick{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px 16px 24px;
    text-align:center;
    box-shadow:0 2px 10px rgba(20,92,78,0.06);
  }
  .joystick-titulo{
    font-weight:900;
    font-size:1.3rem;
    margin:0 0 4px;
    color:var(--text);
  }
  .joystick-instruccion{
    font-weight:600;
    font-size:0.9rem;
    color:var(--text-dim);
    margin:0 0 20px;
  }

  .joystick-pad{
    position:relative;
    width:clamp(280px, 84vw, 340px);
    aspect-ratio:1/1;
    margin:0 auto 24px;
    border-radius:28px;
    overflow:hidden;
    background:linear-gradient(to right, var(--red) 50%, var(--amarillo-fondo) 50%);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,0.06);
    touch-action:none;
  }
  .joystick-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
  }
  .zona{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translate(-50%,-50%);
    font-weight:800;
    font-size:0.85rem;
    line-height:1.2;
    pointer-events:none;
    width:82px;
    z-index:2;
  }
  .zona .emoji-fruta{font-size:1.7rem; line-height:1; margin-bottom:2px;}
  .zona-izq{color:#ffffff; text-shadow:0 1px 4px rgba(0,0,0,0.35);}
  .zona-der{color:#5c4400; text-shadow:none;}
  .zona-up-left{top:14%; left:14%;}
  .zona-left{top:50%; left:7%;}
  .zona-down-left{top:86%; left:14%;}
  .zona-up-right{top:14%; left:86%;}
  .zona-right{top:50%; left:93%;}
  .zona-down-right{top:86%; left:86%;}

  .joystick-knob{
    position:absolute;
    top:50%;
    left:50%;
    width:82px;
    height:82px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2c7f6c, var(--teal-dark));
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    cursor:grab;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    transition:box-shadow 0.15s ease;
    z-index:3;
  }
  .joystick-knob.activo{
    cursor:grabbing;
    box-shadow:0 8px 22px rgba(0,0,0,0.45);
  }
  .joystick-knob svg{width:44px; height:44px;}

  /* ===== Conteos ===== */
  .fila-conteo{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .fila-conteo:last-child{margin-bottom:0;}
  .conteo-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:64px;
  }
  .conteo-emoji{font-size:1.7rem; line-height:1; margin-bottom:2px;}
  .conteo-dot{
    width:14px; height:14px; border-radius:50%;
    margin-bottom:6px;
  }
  .conteo-valor{
    font-size:2rem;
    font-weight:900;
    line-height:1;
  }
  .conteo-etiqueta{
    font-size:0.8rem;
    font-weight:700;
    color:var(--text-dim);
    margin-top:2px;
  }
  #conteo-manzana{color:var(--red);}
  #conteo-limon{color:var(--limon);}
  #conteo-dinamica{color:var(--red);}
  #conteo-seguidores{color:var(--teal);}
  #conteo-sincondicion{color:var(--gold);}
  .dot-dinamica{background:var(--red);}
  .dot-seguidores{background:var(--teal);}
  .dot-sincondicion{background:var(--gold);}

  hr.sep{
    border:none;
    border-top:1px solid var(--border);
    margin:18px 0;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:60;
    pointer-events:none;
    box-shadow:0 6px 18px rgba(20,92,78,0.15);
    max-width:88vw;
    text-align:center;
  }
  .toast.mostrar{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast.error{border-color:var(--red); color:var(--red);}
</style>
</head>
<body>

<div class="app-container">
  <h1 class="title">BENEDICTINO</h1>
  <p class="subtitulo-app">en CicloRecreoVía</p>

  <div class="selector-fecha-wrap" id="selector-fecha-wrap">
    <button class="selector-fecha-btn" id="selector-fecha-btn" type="button">
      <span id="selector-fecha-label">Cargando fechas…</span>
      <svg class="flecha" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="selector-fecha-lista" id="selector-fecha-lista"></div>
  </div>

  <div class="suma-total">
    Botellas entregadas
    <span class="hasta-ahora">(Hasta ahora)</span>
    <span id="suma-total">0</span>
  </div>

  <div class="seccion-joystick">
    <p class="joystick-titulo">Registrar entrega</p>
    <p class="joystick-instruccion">Arrastra el botón central hacia la combinación correspondiente</p>

    <div class="joystick-pad" id="joystick-pad">
      <svg class="joystick-svg" viewBox="0 0 300 300" preserveAspectRatio="none">
        <line x1="150" y1="150" x2="68.7" y2="68.7" stroke="rgba(255,255,255,0.4)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="150" x2="35" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="150" x2="68.7" y2="231.3" stroke="rgba(255,255,255,0.4)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="150" x2="231.3" y2="68.7" stroke="rgba(255,255,255,0.28)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="150" x2="265" y2="150" stroke="rgba(255,255,255,0.28)" stroke-width="26" stroke-linecap="round"/>
        <line x1="150" y1="150" x2="231.3" y2="231.3" stroke="rgba(255,255,255,0.28)" stroke-width="26" stroke-linecap="round"/>
      </svg>

      <div class="zona zona-izq zona-up-left"><span class="emoji-fruta">🍎</span>Dinámica</div>
      <div class="zona zona-izq zona-left"><span class="emoji-fruta">🍎</span>Sin condición</div>
      <div class="zona zona-izq zona-down-left"><span class="emoji-fruta">🍎</span>Seguidores</div>
      <div class="zona zona-der zona-up-right"><span class="emoji-fruta">🍋</span>Dinámica</div>
      <div class="zona zona-der zona-right"><span class="emoji-fruta">🍋</span>Sin condición</div>
      <div class="zona zona-der zona-down-right"><span class="emoji-fruta">🍋</span>Seguidores</div>

      <div class="joystick-knob" id="joystick-knob">
        <svg viewBox="0 0 24 24" fill="none">
          <line x1="9.88" y1="9.88" x2="4.93" y2="4.93" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="9" y1="12" x2="2" y2="12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="9.88" y1="14.12" x2="4.93" y2="19.07" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14.12" y1="9.88" x2="19.07" y2="4.93" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="15" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14.12" y1="14.12" x2="19.07" y2="19.07" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="4.93" cy="4.93" r="1.3" fill="#ffffff"/>
          <circle cx="2" cy="12" r="1.3" fill="#ffffff"/>
          <circle cx="4.93" cy="19.07" r="1.3" fill="#ffffff"/>
          <circle cx="19.07" cy="4.93" r="1.3" fill="#ffffff"/>
          <circle cx="22" cy="12" r="1.3" fill="#ffffff"/>
          <circle cx="19.07" cy="19.07" r="1.3" fill="#ffffff"/>
          <circle cx="12" cy="12" r="2.1" fill="#ffffff"/>
        </svg>
      </div>
    </div>

    <div class="fila-conteo">
      <div class="conteo-item">
        <span class="conteo-emoji">🍎</span>
        <span class="conteo-valor" id="conteo-manzana">0</span>
        <span class="conteo-etiqueta">Manzana</span>
      </div>
      <div class="conteo-item">
        <span class="conteo-emoji">🍋</span>
        <span class="conteo-valor" id="conteo-limon">0</span>
        <span class="conteo-etiqueta">Limón</span>
      </div>
    </div>

    <hr class="sep">

    <div class="fila-conteo">
      <div class="conteo-item">
        <span class="conteo-dot dot-dinamica"></span>
        <span class="conteo-valor" id="conteo-dinamica">0</span>
        <span class="conteo-etiqueta">Dinámica</span>
      </div>
      <div class="conteo-item">
        <span class="conteo-dot dot-seguidores"></span>
        <span class="conteo-valor" id="conteo-seguidores">0</span>
        <span class="conteo-etiqueta">Seguidores</span>
      </div>
      <div class="conteo-item">
        <span class="conteo-dot dot-sincondicion"></span>
        <span class="conteo-valor" id="conteo-sincondicion">0</span>
        <span class="conteo-etiqueta">Sin condición</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= CONFIGURACIÓN ================= */
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwGEIfRKiyotTA_vPf3UZRZT4uM7_uIAOaVVV5AX5o9VBr3kPT_rzUoXMBJ7MkTD35O/exec";
const REFRESH_MS = 30000;

/* ================= FECHAS ================= */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function hoyKey(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function labelDeFecha(key){
  const [y,m,d] = key.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  const dia = DIAS[dateObj.getDay()];
  const diaCap = dia.charAt(0).toUpperCase() + dia.slice(1);
  return `${diaCap} ${d} de ${MESES[m-1]}`;
}

const FECHA_HOY = hoyKey();
let fechaSeleccionada = FECHA_HOY;

/* ================= ESTADO ================= */
let cuentaManzana = 0;
let cuentaLimon = 0;
let cuentaDinamica = 0;
let cuentaSeguidores = 0;
let cuentaSinCondicion = 0;

/* ================= TOAST ================= */
let toastTimer;
function mostrarToast(msg, esError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!esError);
  t.classList.add('mostrar');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('mostrar'), 3200);
}

/* ================= RENDER ================= */
function render(){
  document.getElementById('conteo-manzana').textContent = cuentaManzana;
  document.getElementById('conteo-limon').textContent = cuentaLimon;
  document.getElementById('conteo-dinamica').textContent = cuentaDinamica;
  document.getElementById('conteo-seguidores').textContent = cuentaSeguidores;
  document.getElementById('conteo-sincondicion').textContent = cuentaSinCondicion;
  document.getElementById('suma-total').textContent = cuentaDinamica + cuentaSeguidores + cuentaSinCondicion;
}

/* ================= SELECTOR DE FECHA ================= */
const wrapFecha = document.getElementById('selector-fecha-wrap');
const btnFecha = document.getElementById('selector-fecha-btn');
const labelFecha = document.getElementById('selector-fecha-label');
const listaFecha = document.getElementById('selector-fecha-lista');

btnFecha.addEventListener('click', () => {
  wrapFecha.classList.toggle('abierto');
});
document.addEventListener('click', (ev) => {
  if(!wrapFecha.contains(ev.target)) wrapFecha.classList.remove('abierto');
});

function pintarListaFechas(fechas){
  listaFecha.innerHTML = '';
  fechas.forEach(key => {
    const opt = document.createElement('div');
    opt.className = 'opcion-fecha' + (key === fechaSeleccionada ? ' activa' : '');
    opt.textContent = labelDeFecha(key) + (key === FECHA_HOY ? ' (hoy)' : '');
    opt.addEventListener('click', () => {
      fechaSeleccionada = key;
      wrapFecha.classList.remove('abierto');
      labelFecha.textContent = labelDeFecha(key) + (key === FECHA_HOY ? ' (hoy)' : '');
      pintarListaFechas(fechas);
      cargarDatos(fechaSeleccionada);
    });
    listaFecha.appendChild(opt);
  });
}

function cargarListaFechas(){
  const cbName = 'cbf_' + Date.now();
  window[cbName] = function(data){
    let fechas = (data && data.fechas) ? data.fechas : [];
    if(!fechas.includes(FECHA_HOY)) fechas.unshift(FECHA_HOY);
    fechas.sort((a,b) => b.localeCompare(a));
    labelFecha.textContent = labelDeFecha(fechaSeleccionada) + (fechaSeleccionada === FECHA_HOY ? ' (hoy)' : '');
    pintarListaFechas(fechas);
    delete window[cbName];
    script.remove();
  };
  const script = document.createElement('script');
  script.src = `${ENDPOINT_URL}?action=getFechas&callback=${cbName}`;
  script.onerror = function(){
    delete window[cbName];
    script.remove();
    labelFecha.textContent = labelDeFecha(fechaSeleccionada) + (fechaSeleccionada === FECHA_HOY ? ' (hoy)' : '');
    pintarListaFechas([FECHA_HOY]);
  };
  document.body.appendChild(script);
}

/* ================= LECTURA DE DATOS (JSONP para evitar CORS) ================= */
function cargarDatos(fecha){
  const cbName = 'cb_' + Date.now();
  window[cbName] = function(data){
    if(data && !data.error){
      cuentaManzana = data.manzana || 0;
      cuentaLimon = data.limon || 0;
      cuentaDinamica = data.dinamica || 0;
      cuentaSeguidores = data.seguidores || 0;
      cuentaSinCondicion = data.sinCondicion || 0;
      render();
    }
    delete window[cbName];
    script.remove();
  };
  const script = document.createElement('script');
  script.src = `${ENDPOINT_URL}?action=getData&fecha=${fecha}&callback=${cbName}`;
  script.onerror = function(){ delete window[cbName]; script.remove(); };
  document.body.appendChild(script);
}

/* ================= ESCRITURA ================= */
function enviarDato(payload, onOk, onError){
  fetch(ENDPOINT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    if(res && res.ok){ onOk && onOk(); }
    else { onError && onError(res && res.error); }
  })
  .catch((err) => { onError && onError(err && err.message); });
}

/* ================= JOYSTICK ================= */
const pad = document.getElementById('joystick-pad');
const knob = document.getElementById('joystick-knob');
const ARRASTRE_MINIMO = 34;

const DIRECCIONES = [
  { dx:-0.7071, dy:-0.7071, fruta:'Manzana', categoria:'Dinámica' },
  { dx:-1,      dy: 0,      fruta:'Manzana', categoria:'Sin condición' },
  { dx:-0.7071, dy: 0.7071, fruta:'Manzana', categoria:'Seguidores' },
  { dx: 0.7071, dy:-0.7071, fruta:'Limón',   categoria:'Dinámica' },
  { dx: 1,      dy: 0,      fruta:'Limón',   categoria:'Sin condición' },
  { dx: 0.7071, dy: 0.7071, fruta:'Limón',   categoria:'Seguidores' }
];

let arrastrando = false;
let centroX = 0, centroY = 0;
let padRadio = 100;

function centrarKnob(){
  knob.style.transform = 'translate(-50%, -50%)';
}

knob.addEventListener('pointerdown', (ev) => {
  arrastrando = true;
  knob.setPointerCapture(ev.pointerId);
  const rect = pad.getBoundingClientRect();
  centroX = rect.left + rect.width/2;
  centroY = rect.top + rect.height/2;
  padRadio = Math.min(rect.width, rect.height)/2 - 46;
  knob.classList.add('activo');
});

knob.addEventListener('pointermove', (ev) => {
  if(!arrastrando) return;
  let dx = ev.clientX - centroX;
  let dy = ev.clientY - centroY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > padRadio){
    dx = dx / dist * padRadio;
    dy = dy / dist * padRadio;
  }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
});

function soltarKnob(ev){
  if(!arrastrando) return;
  arrastrando = false;
  knob.classList.remove('activo');
  const dx = ev.clientX - centroX;
  const dy = ev.clientY - centroY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  centrarKnob();

  if(dist < ARRASTRE_MINIMO) return;

  const ndx = dx/dist, ndy = dy/dist;
  let mejor = null, mejorProd = -Infinity;
  DIRECCIONES.forEach(d => {
    const prod = d.dx*ndx + d.dy*ndy;
    if(prod > mejorProd){ mejorProd = prod; mejor = d; }
  });
  if(mejor) registrarCombo(mejor.fruta, mejor.categoria);
}

knob.addEventListener('pointerup', soltarKnob);
knob.addEventListener('pointercancel', () => {
  arrastrando = false;
  knob.classList.remove('activo');
  centrarKnob();
});

/* ================= REGISTRO (sin confirmación) ================= */
function registrarCombo(fruta, categoria){
  enviarDato(
    {action:'submitCombo', fecha: fechaSeleccionada, fruta: fruta, categoria: categoria},
    () => {
      if(fruta === 'Manzana') cuentaManzana++; else cuentaLimon++;
      if(categoria === 'Dinámica') cuentaDinamica++;
      if(categoria === 'Seguidores') cuentaSeguidores++;
      if(categoria === 'Sin condición') cuentaSinCondicion++;
      render();
      mostrarToast(`Registrado: ${fruta} + ${categoria}`);
      cargarListaFechas();
    },
    (msg) => mostrarToast('No se pudo registrar' + (msg ? ': ' + msg : '.'), true)
  );
}

/* ================= INICIO ================= */
centrarKnob();
render();
cargarListaFechas();
cargarDatos(fechaSeleccionada);
setInterval(() => cargarDatos(fechaSeleccionada), REFRESH_MS);
</script>
