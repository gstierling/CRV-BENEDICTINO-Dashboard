<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENEDICTINO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;
    --panel:#ffffff;
    --panel-2:#f2efe6;
    --teal:#145c4e;
    --teal-dark:#0d4238;
    --red:#c0392b;
    --red-dark:#9e2f22;
    --gold:#a9781f;
    --limon:#c9a30a;
    --amarillo-fondo:#f2c230;
    --text:#1c2b28;
    --text-dim:#6b7b76;
    --border:#e3ded2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    display:flex;
    justify-content:center;
    padding:16px 14px 36px;
    overflow-x:hidden;
  }
  .app-container{
    width:100%;
    max-width:640px;
  }
  .title{
    text-align:center;
    font-size:2.6rem;
    font-weight:900;
    letter-spacing:2px;
    margin:0;
    color:var(--teal);
  }
  .subtitulo-app{
    text-align:center;
    margin:0;
    font-size:1.5rem;
    font-weight:700;
    color:var(--text-dim);
  }

  /* ===== Selector de fecha ===== */
  .selector-fecha-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    margin:6px 0 14px;
  }
  .selector-fecha-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    padding:9px 16px;
    border-radius:12px;
    cursor:pointer;
    text-transform:capitalize;
    transition:border-color 0.15s ease;
    box-shadow:0 1px 3px rgba(20,92,78,0.08);
  }
  .selector-fecha-btn:hover{border-color:var(--teal);}
  .selector-fecha-btn .flecha{
    width:16px;height:16px;color:var(--red);
    transition:transform 0.15s ease;
  }
  .selector-fecha-wrap.abierto .flecha{transform:rotate(180deg);}
  .selector-fecha-lista{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    min-width:230px;
    max-height:260px;
    overflow-y:auto;
    z-index:40;
    box-shadow:0 12px 28px rgba(20,92,78,0.18);
  }
  .selector-fecha-wrap.abierto .selector-fecha-lista{display:block;}
  .opcion-fecha{
    padding:11px 16px;
    font-weight:600;
    font-size:0.98rem;
    color:var(--text);
    cursor:pointer;
    text-transform:capitalize;
    border-bottom:1px solid var(--border);
  }
  .opcion-fecha:last-child{border-bottom:none;}
  .opcion-fecha:hover{background:var(--panel-2);}
  .opcion-fecha.activa{color:var(--teal); font-weight:800;}

  /* ===== Botellas entregadas ===== */
  .bloque-botellas{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:6px 0 20px;
    flex-wrap:wrap;
  }
  .botellas-fila{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .botellas-label{
    font-size:clamp(1.05rem, 4vw, 1.3rem);
    font-weight:800;
    color:var(--text-dim);
  }
  .botellas-num-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .botellas-num{
    font-size:clamp(2.6rem, 11vw, 3.6rem);
    font-weight:900;
    color:var(--teal-dark);
    line-height:1;
  }
  .botellas-pct{
    font-size:0.85rem;
    font-weight:700;
    color:var(--text-dim);
    margin-top:2px;
  }
  .botellas-fruta-box{
    display:flex;
    flex-direction:column;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
    min-width:64px;
  }
  .fruta-box-item{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:9px 14px;
    font-weight:900;
    font-size:1.35rem;
  }
  .fruta-box-manzana{background:var(--red); color:#ffffff;}
  .fruta-box-limon{background:var(--amarillo-fondo); color:#5c4400;}

  /* ===== Joystick ===== */
  .seccion-joystick{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px 16px 24px;
    text-align:center;
    box-shadow:0 2px 10px rgba(20,92,78,0.06);
  }

  .joystick-full-bleed{
    width:100vw;
    position:relative;
    left:50%;
    right:50%;
    margin-left:-50vw;
    margin-right:-50vw;
    margin-bottom:22px;
  }
  .joystick-pad{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    margin:0 auto;
    overflow:visible;
    background:linear-gradient(to right, var(--red) 50%, var(--amarillo-fondo) 50%);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,0.06);
    touch-action:none;
  }
  .fruta-fondo{
    position:absolute;
    top:50%;
    font-size:min(38vw, 190px);
    line-height:1;
    transform:translate(-50%,-50%);
    opacity:0.42;
    z-index:0;
    pointer-events:none;
  }
  .fruta-fondo-izq{left:25%;}
  .fruta-fondo-der{left:75%;}
  .joystick-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
  }
  .zona{
    position:absolute;
    transform:translate(-50%,-50%);
    font-weight:900;
    font-size:0.92rem;
    letter-spacing:0.2px;
    line-height:1.15;
    pointer-events:none;
    width:auto;
    max-width:100px;
    z-index:2;
    color:var(--text);
    background:rgba(255,255,255,0.92);
    padding:8px 10px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.18);
    text-align:center;
  }
  .zona-up-left{top:15%; left:16%;}
  .zona-left{top:50%; left:14%;}
  .zona-down-left{top:85%; left:16%;}
  .zona-up-right{top:15%; left:84%;}
  .zona-right{top:50%; left:86%;}
  .zona-down-right{top:85%; left:84%;}

  .joystick-knob{
    position:absolute;
    top:50%;
    left:50%;
    width:66px;
    height:66px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2c7f6c, var(--teal-dark));
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    cursor:grab;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    transition:box-shadow 0.15s ease;
    z-index:3;
  }
  .joystick-knob.activo{
    cursor:grabbing;
    box-shadow:0 8px 22px rgba(0,0,0,0.45);
  }
  .joystick-knob svg{width:38px; height:38px;}

  /* ===== Barras Manzana / Limón ===== */
  .barras-fruta{
    max-width:420px;
    margin:0 auto 20px;
  }
  .barra-fila{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .barra-fila:last-child{margin-bottom:0;}
  .barra-etiqueta{
    width:88px;
    text-align:left;
    font-weight:800;
    font-size:0.95rem;
    flex-shrink:0;
  }
  .barra-track{
    flex:1;
    height:20px;
    background:var(--panel-2);
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .barra-fill{
    height:100%;
    width:0%;
    border-radius:10px;
    transition:width 0.4s ease;
  }
  .barra-fill-manzana{background:var(--red);}
  .barra-fill-limon{background:var(--amarillo-fondo);}
  .barra-valor{
    width:32px;
    text-align:right;
    font-weight:900;
    font-size:1.1rem;
    flex-shrink:0;
  }

  hr.sep{
    border:none;
    border-top:1px solid var(--border);
    margin:18px 0;
  }

  /* ===== Conteos por categoría ===== */
  .fila-conteo-cat{
    display:flex;
    justify-content:center;
    gap:24px;
    flex-wrap:wrap;
  }
  .conteo-item-cat{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:80px;
  }
  .icono-cat{
    width:46px;
    height:46px;
    margin-bottom:6px;
  }
  .conteo-valor-cat{
    font-size:2.3rem;
    font-weight:900;
    line-height:1;
  }
  .conteo-etiqueta-cat{
    font-size:0.95rem;
    font-weight:800;
    color:var(--text-dim);
    margin-top:4px;
  }
  #conteo-dinamica{color:var(--red);}
  #conteo-seguidores{color:var(--teal);}
  #conteo-sincondicion{color:var(--gold);}

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:60;
    pointer-events:none;
    box-shadow:0 6px 18px rgba(20,92,78,0.15);
    max-width:88vw;
    text-align:center;
  }
  .toast.mostrar{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast.error{border-color:var(--red); color:var(--red);}
</style>
</head>
<body>

<div class="app-container">
  <h1 class="title">BENEDICTINO</h1>
  <p class="subtitulo-app">en CicloRecreoVía</p>

  <div class="selector-fecha-wrap" id="selector-fecha-wrap">
    <button class="selector-fecha-btn" id="selector-fecha-btn" type="button">
      <span id="selector-fecha-label">Cargando fechas…</span>
      <svg class="flecha" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="selector-fecha-lista" id="selector-fecha-lista"></div>
  </div>

  <div class="bloque-botellas">
    <div class="botellas-fila">
      <span class="botellas-label">Botellas entregadas</span>
      <div class="botellas-num-wrap">
        <span class="botellas-num" id="suma-total">0</span>
        <span class="botellas-pct" id="botellas-pct">(0%)</span>
      </div>
    </div>
    <div class="botellas-fruta-box">
      <div class="fruta-box-item fruta-box-manzana" id="mini-manzana">0</div>
      <div class="fruta-box-item fruta-box-limon" id="mini-limon">0</div>
    </div>
  </div>

  <div class="seccion-joystick">
    <div class="joystick-full-bleed">
      <div class="joystick-pad" id="joystick-pad">
        <span class="fruta-fondo fruta-fondo-izq">🍎</span>
        <span class="fruta-fondo fruta-fondo-der">🍋</span>

        <svg class="joystick-svg" viewBox="0 0 300 300" preserveAspectRatio="none">
          <line x1="150" y1="150" x2="68.7" y2="68.7" stroke="rgba(255,255,255,0.4)" stroke-width="26" stroke-linecap="round"/>
          <line x1="150" y1="150" x2="35" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="26" stroke-linecap="round"/>
          <line x1="150" y1="150" x2="68.7" y2="231.3" stroke="rgba(255,255,255,0.4)" stroke-width="26" stroke-linecap="round"/>
          <line x1="150" y1="150" x2="231.3" y2="68.7" stroke="rgba(255,255,255,0.28)" stroke-width="26" stroke-linecap="round"/>
          <line x1="150" y1="150" x2="265" y2="150" stroke="rgba(255,255,255,0.28)" stroke-width="26" stroke-linecap="round"/>
          <line x1="150" y1="150" x2="231.3" y2="231.3" stroke="rgba(255,255,255,0.28)" stroke-width="26" stroke-linecap="round"/>
        </svg>

        <div class="zona zona-up-left">Dinámica</div>
        <div class="zona zona-left">Sin condición</div>
        <div class="zona zona-down-left">Seguidores</div>
        <div class="zona zona-up-right">Dinámica</div>
        <div class="zona zona-right">Sin condición</div>
        <div class="zona zona-down-right">Seguidores</div>

        <div class="joystick-knob" id="joystick-knob">
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="9.88" y1="9.88" x2="4.93" y2="4.93" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
            <line x1="9" y1="12" x2="2" y2="12" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
            <line x1="9.88" y1="14.12" x2="4.93" y2="19.07" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
            <line x1="14.12" y1="9.88" x2="19.07" y2="4.93" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
            <line x1="15" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
            <line x1="14.12" y1="14.12" x2="19.07" y2="19.07" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="2.6" fill="#ffffff"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="barras-fruta">
      <div class="barra-fila">
        <span class="barra-etiqueta">🍎 Manzana</span>
        <div class="barra-track"><div class="barra-fill barra-fill-manzana" id="barra-manzana"></div></div>
        <span class="barra-valor" id="conteo-manzana">0</span>
      </div>
      <div class="barra-fila">
        <span class="barra-etiqueta">🍋 Limón</span>
        <div class="barra-track"><div class="barra-fill barra-fill-limon" id="barra-limon"></div></div>
        <span class="barra-valor" id="conteo-limon">0</span>
      </div>
    </div>

    <hr class="sep">

    <div class="fila-conteo-cat">
      <div class="conteo-item-cat">
        <svg class="icono-cat" viewBox="0 0 64 64" fill="none">
          <rect x="8" y="8" width="48" height="48" rx="10" stroke="#c0392b" stroke-width="4"/>
          <circle cx="21" cy="21" r="4.5" fill="#c0392b"/>
          <circle cx="43" cy="21" r="4.5" fill="#c0392b"/>
          <circle cx="21" cy="43" r="4.5" fill="#c0392b"/>
          <circle cx="43" cy="43" r="4.5" fill="#c0392b"/>
          <circle cx="32" cy="32" r="4.5" fill="#c0392b"/>
        </svg>
        <span class="conteo-valor-cat" id="conteo-dinamica">0</span>
        <span class="conteo-etiqueta-cat">Dinámica</span>
      </div>
      <div class="conteo-item-cat">
        <svg class="icono-cat" viewBox="0 0 64 64" fill="none">
          <circle cx="24" cy="22" r="9" stroke="#145c4e" stroke-width="4"/>
          <path d="M8 54c2-12 9-18 16-18s14 6 16 18" stroke="#145c4e" stroke-width="4" stroke-linecap="round"/>
          <circle cx="44" cy="26" r="9" stroke="#145c4e" stroke-width="4" opacity="0.5"/>
          <path d="M30 54c2-11 8-16 14-16s12 5 14 16" stroke="#145c4e" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
        </svg>
        <span class="conteo-valor-cat" id="conteo-seguidores">0</span>
        <span class="conteo-etiqueta-cat">Seguidores</span>
      </div>
      <div class="conteo-item-cat">
        <svg class="icono-cat" viewBox="0 0 64 64" fill="none">
          <rect x="10" y="24" width="44" height="26" rx="4" stroke="#a9781f" stroke-width="4"/>
          <path d="M10 32h44" stroke="#a9781f" stroke-width="4"/>
          <path d="M32 24v26" stroke="#a9781f" stroke-width="4"/>
          <path d="M32 24c-4-9-17-9-17 0 7 2 13 2 17 0zM32 24c4-9 17-9 17 0-7 2-13 2-17 0z" stroke="#a9781f" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        <span class="conteo-valor-cat" id="conteo-sincondicion">0</span>
        <span class="conteo-etiqueta-cat">Sin condición</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= CONFIGURACIÓN ================= */
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwGEIfRKiyotTA_vPf3UZRZT4uM7_uIAOaVVV5AX5o9VBr3kPT_rzUoXMBJ7MkTD35O/exec";
const REFRESH_MS = 30000;
const TOTAL_BOTELLAS = 1160;

/* ================= FECHAS ================= */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function hoyKey(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function labelDeFecha(key){
  const [y,m,d] = key.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  const dia = DIAS[dateObj.getDay()];
  const diaCap = dia.charAt(0).toUpperCase() + dia.slice(1);
  return `${diaCap} ${d} de ${MESES[m-1]}`;
}

const FECHA_HOY = hoyKey();
let fechaSeleccionada = FECHA_HOY;

/* ================= ESTADO ================= */
let cuentaManzana = 0;
let cuentaLimon = 0;
let cuentaDinamica = 0;
let cuentaSeguidores = 0;
let cuentaSinCondicion = 0;

/* ================= TOAST ================= */
let toastTimer;
function mostrarToast(msg, esError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!esError);
  t.classList.add('mostrar');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('mostrar'), 3200);
}

/* ================= RENDER ================= */
function render(){
  const total = cuentaDinamica + cuentaSeguidores + cuentaSinCondicion;
  document.getElementById('suma-total').textContent = total;
  const pct = Math.round((total / TOTAL_BOTELLAS) * 100);
  document.getElementById('botellas-pct').textContent = `(${pct}%)`;

  document.getElementById('mini-manzana').textContent = cuentaManzana;
  document.getElementById('mini-limon').textContent = cuentaLimon;

  document.getElementById('conteo-manzana').textContent = cuentaManzana;
  document.getElementById('conteo-limon').textContent = cuentaLimon;
  const maxFruta = Math.max(cuentaManzana, cuentaLimon, 1);
  document.getElementById('barra-manzana').style.width = (cuentaManzana/maxFruta*100) + '%';
  document.getElementById('barra-limon').style.width = (cuentaLimon/maxFruta*100) + '%';

  document.getElementById('conteo-dinamica').textContent = cuentaDinamica;
  document.getElementById('conteo-seguidores').textContent = cuentaSeguidores;
  document.getElementById('conteo-sincondicion').textContent = cuentaSinCondicion;
}

/* ================= SELECTOR DE FECHA ================= */
const wrapFecha = document.getElementById('selector-fecha-wrap');
const btnFecha = document.getElementById('selector-fecha-btn');
const labelFecha = document.getElementById('selector-fecha-label');
const listaFecha = document.getElementById('selector-fecha-lista');

btnFecha.addEventListener('click', () => {
  wrapFecha.classList.toggle('abierto');
});
document.addEventListener('click', (ev) => {
  if(!wrapFecha.contains(ev.target)) wrapFecha.classList.remove('abierto');
});

function pintarListaFechas(fechas){
  listaFecha.innerHTML = '';
  fechas.forEach(key => {
    const opt = document.createElement('div');
    opt.className = 'opcion-fecha' + (key === fechaSeleccionada ? ' activa' : '');
    opt.textContent = labelDeFecha(key) + (key === FECHA_HOY ? ' (hoy)' : '');
    opt.addEventListener('click', () => {
      fechaSeleccionada = key;
      wrapFecha.classList.remove('abierto');
      labelFecha.textContent = labelDeFecha(key) + (key === FECHA_HOY ? ' (hoy)' : '');
      pintarListaFechas(fechas);
      cargarDatos(fechaSeleccionada);
    });
    listaFecha.appendChild(opt);
  });
}

function cargarListaFechas(){
  const cbName = 'cbf_' + Date.now();
  window[cbName] = function(data){
    let fechas = (data && data.fechas) ? data.fechas : [];
    if(!fechas.includes(FECHA_HOY)) fechas.unshift(FECHA_HOY);
    fechas.sort((a,b) => b.localeCompare(a));
    labelFecha.textContent = labelDeFecha(fechaSeleccionada) + (fechaSeleccionada === FECHA_HOY ? ' (hoy)' : '');
    pintarListaFechas(fechas);
    delete window[cbName];
    script.remove();
  };
  const script = document.createElement('script');
  script.src = `${ENDPOINT_URL}?action=getFechas&callback=${cbName}`;
  script.onerror = function(){
    delete window[cbName];
    script.remove();
    labelFecha.textContent = labelDeFecha(fechaSeleccionada) + (fechaSeleccionada === FECHA_HOY ? ' (hoy)' : '');
    pintarListaFechas([FECHA_HOY]);
  };
  document.body.appendChild(script);
}

/* ================= LECTURA DE DATOS (JSONP para evitar CORS) ================= */
function cargarDatos(fecha){
  const cbName = 'cb_' + Date.now();
  window[cbName] = function(data){
    if(data && !data.error){
      cuentaManzana = data.manzana || 0;
      cuentaLimon = data.limon || 0;
      cuentaDinamica = data.dinamica || 0;
      cuentaSeguidores = data.seguidores || 0;
      cuentaSinCondicion = data.sinCondicion || 0;
      render();
    }
    delete window[cbName];
    script.remove();
  };
  const script = document.createElement('script');
  script.src = `${ENDPOINT_URL}?action=getData&fecha=${fecha}&callback=${cbName}`;
  script.onerror = function(){ delete window[cbName]; script.remove(); };
  document.body.appendChild(script);
}

/* ================= ESCRITURA ================= */
function enviarDato(payload, onOk, onError){
  fetch(ENDPOINT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    if(res && res.ok){ onOk && onOk(); }
    else { onError && onError(res && res.error); }
  })
  .catch((err) => { onError && onError(err && err.message); });
}

/* ================= JOYSTICK ================= */
const pad = document.getElementById('joystick-pad');
const knob = document.getElementById('joystick-knob');

const DIRECCIONES = [
  { dx:-0.7071, dy:-0.7071, fruta:'Manzana', categoria:'Dinámica' },
  { dx:-1,      dy: 0,      fruta:'Manzana', categoria:'Sin condición' },
  { dx:-0.7071, dy: 0.7071, fruta:'Manzana', categoria:'Seguidores' },
  { dx: 0.7071, dy:-0.7071, fruta:'Limón',   categoria:'Dinámica' },
  { dx: 1,      dy: 0,      fruta:'Limón',   categoria:'Sin condición' },
  { dx: 0.7071, dy: 0.7071, fruta:'Limón',   categoria:'Seguidores' }
];

let arrastrando = false;
let centroX = 0, centroY = 0;
let padRadio = 100;

function centrarKnob(){
  knob.style.transform = 'translate(-50%, -50%)';
}

knob.addEventListener('pointerdown', (ev) => {
  arrastrando = true;
  knob.style.transition = 'none';
  knob.setPointerCapture(ev.pointerId);
  const rect = pad.getBoundingClientRect();
  centroX = rect.left + rect.width/2;
  centroY = rect.top + rect.height/2;
  padRadio = Math.min(rect.width, rect.height)/2 - 40;
  knob.classList.add('activo');
});

knob.addEventListener('pointermove', (ev) => {
  if(!arrastrando) return;
  let dx = ev.clientX - centroX;
  let dy = ev.clientY - centroY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > padRadio){
    dx = dx / dist * padRadio;
    dy = dy / dist * padRadio;
  }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
});

function soltarKnob(ev){
  if(!arrastrando) return;
  arrastrando = false;
  knob.classList.remove('activo');
  const dx = ev.clientX - centroX;
  const dy = ev.clientY - centroY;
  const dist = Math.sqrt(dx*dx + dy*dy);

  knob.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
  centrarKnob();

  const umbral = padRadio * 0.67;
  if(dist < umbral) return;

  const ndx = dx/dist, ndy = dy/dist;
  let mejor = null, mejorProd = -Infinity;
  DIRECCIONES.forEach(d => {
    const prod = d.dx*ndx + d.dy*ndy;
    if(prod > mejorProd){ mejorProd = prod; mejor = d; }
  });
  if(mejor) registrarCombo(mejor.fruta, mejor.categoria);
}

knob.addEventListener('pointerup', soltarKnob);
knob.addEventListener('pointercancel', () => {
  arrastrando = false;
  knob.classList.remove('activo');
  knob.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
  centrarKnob();
});

/* ================= REGISTRO (sin confirmación) ================= */
function registrarCombo(fruta, categoria){
  enviarDato(
    {action:'submitCombo', fecha: fechaSeleccionada, fruta: fruta, categoria: categoria},
    () => {
      if(fruta === 'Manzana') cuentaManzana++; else cuentaLimon++;
      if(categoria === 'Dinámica') cuentaDinamica++;
      if(categoria === 'Seguidores') cuentaSeguidores++;
      if(categoria === 'Sin condición') cuentaSinCondicion++;
      render();
      mostrarToast(`Registrado: ${fruta} + ${categoria}`);
      cargarListaFechas();
    },
    (msg) => mostrarToast('No se pudo registrar' + (msg ? ': ' + msg : '.'), true)
  );
}

/* ================= INICIO ================= */
centrarKnob();
render();
cargarListaFechas();
cargarDatos(fechaSeleccionada);
setInterval(() => cargarDatos(fechaSeleccionada), REFRESH_MS);
</script>
